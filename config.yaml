# auto_env - draft automation for bee (multi-account CloudBees)
# Edit this file, then: provision.csh (build cred+node) -> deploy.csh (create jobs) -> run.csh

# -- STABLE: rarely changes. cred+node reused via complete.yml --
base_name: RX_AUTO          # change by hand to avoid folder/node/job name clashes (RX_AUTO_v2...)
controller: ""              # "" = use the active controller; a name = auto `bee controller select`
rx_auto_root: ""            # "" = auto-derived from where rxauto.sh lives (RXAUTO_ROOT). Set a path to override.

accounts:                   # Linux accounts -> 1 cred + 1 node each
  - { username: user01, password: pass01 }
  - { username: user02, password: pass02 }
  - { username: user03, password: pass03 }

node:
  host: 10.0.0.10           # SSH host for all nodes (all accounts share the same host)
  port: 22
  remote_dir_base: ""       # "" -> auto: $RX_AUTO_ROOT/cb_remote/<username>
  executors: 1

# -- SWITCHES --
mode: manual                # manual (N jobs, work-stealing rx_run) | auto (1 job with schedule)
ip_mode: common             # common | trunk | all -> picks host + default IP_MODE param

# -- LSF submit (bs) - shared by manual step-3 and the rx_setup job --
# Everything runs inside one `tcsh -f -c '...'` so `source my_ride_setup` takes effect.
bs:
  host_groups: "HOSTGR_L HOSTGR_M HOSTGR_S HOSTGR_621910"
  os: REDHATE8
  mem: 12000
  ride_setup: my_ride_setup   # sourced inside tcsh from RX_AUTO_PARENT (next to rxauto.sh), not RX_AUTO/

# -- manual = STEP 3 rx_run, WORK-STEALING --
# RX AUTO pre-splits the module list at setup into SUBMIT_LIST/NORMAL|COMMON/.._00,_01,...
# N accounts = N workers; each claims the next split file (atomic mkdir) until exhausted.
# accounts > splits -> extra workers idle; accounts < splits -> keep claiming.
#   trunk : 01_rx_run_ip_unit.bash        SUBMIT_LIST/NORMAL/normal_submit_module_list_XX
#   common: 02_rx_run_common_ip_unit.bash SUBMIT_LIST/COMMON/common_submit_module_list_XX
# REQUIRES: SUBMIT_LIST shared across nodes (shared claim dir). host=localhost satisfies this.
manual:
  job_prefix: build
  wait: false               # true = bee job run --wait (blocks until each build finishes)
  # $RX_AUTO_ROOT, $BS_GROUPS, $BS_OS, $BS_MEM, $RIDE_SETUP injected by parse_config (from bs:).
  # $IP_MODE and $SPLIT_FILE are build params passed per-build by run.csh.
  command: |
    cd "$RX_AUTO_ROOT"
    if [ "$IP_MODE" = trunk ]; then
      RX=01_rx_run_ip_unit.bash
    else
      RX=02_rx_run_common_ip_unit.bash
    fi
    bs -m "$BS_GROUPS" -I -os "$BS_OS" -M "$BS_MEM" \
      tcsh -f -c "source $RX_AUTO_PARENT/$RIDE_SETUP; bash $RX_AUTO_ROOT/$RX $SPLIT_FILE"

# -- auto = STEP 3 go_rx_auto (orchestrator: detect -> queue -> run all). No index, IP_MODE only. --
auto:
  account: { username: user11, password: pass11, executors: 2 }   # executor=2: trunk+common run in parallel
  job_name: daily
  schedule: "H/30 * * * *"  # every 30 min: go_rx_auto detects SVN changes and runs
  command: |
    cd "$RX_AUTO_ROOT"
    if [ "$IP_MODE" = trunk ]; then ./01_go_rx_auto.bash; else ./02_go_rx_auto.bash; fi

# -- setup = STEP 1-2 as a bee job (alternative to running scripts/setup_all.bash by hand) --
# Runs on a DEDICATED account/node. One bs...tcsh sources RiDE + my_cmd + my_cmd_for_common,
# applies the Makefile common changes, then runs the step-2 makes. Env paths come from
# setup.vars below + bs: above; assembled by `parse_config plan-setup`.
setup:
  job_name: rx_setup
  account: { username: setupuser, password: setuppass }   # dedicated setup account (own cred+node)

  # -- S2 env vars (guide S2). Empty "" here = auto-derived by parse_config from RX_AUTO_ROOT.
  # Set a value to override the derived default. RX_AUTO_ROOT itself comes from rx_auto_root above. --
  vars:
    TRUNK_IP_RXEWS_RUN_DIR_PATH: ""     # "" -> $RX_AUTO_PARENT/rxews_trunk_ip_vnet_ (my_cmd, S5)
    COMMON_RXEWS_RUN_DIR_PATH: ""       # "" -> $RX_AUTO_PARENT/rxews_trunk_vnet_wk_ (my_cmd_for_common, S5)
    DEDICATED_SV: ""                    # "" -> "HOSTGR_L HOSTGR_M HOSTGR_S HOSTGR_621910" (LSF host groups)
    RIDE_ENV_VER: ""                    # "" -> WK18 (RiDE env version tag)
    TRUNK_IP_ENV_BASE: ""               # "" -> <trunk RXEWS>/RxEnv-Trunk-IP-VNET-${REV}  (REV read from that dir's Makefile at runtime)
    COMMON_ENV_BASE: ""                 # "" -> <common RXEWS>/RxEnv-Trunk-VNET-${REV}     (REV read from that dir's Makefile at runtime)
    DASHBOARD_DB_LOCATION: ""           # "" -> $RX_AUTO_PARENT/dashboard_db
    USER_CUSTOM_SRC: ""                 # GENERATED by server_setup; set only to override (optional)
    LOCAL_PYTHON: ""                    # Python 3.10+ binary (optional, user-filled)
    LOCAL_PYTHON_BIN: ""                # Python bin dir (optional, user-filled)
    UPDATE_DB_SCHEDULES: ""             # dashboard update times e.g. 00:00,11:30 (optional, user-filled)
    COMMON_RUN_TYPE: Trunk              # fixed - do not change

  # -- S4 Makefile changes (guide S4). Empty new "" = skip. old: for reference only (not checked). --

  # Applied to BOTH env dirs (trunk IP + common IP):
  makefile_common_changes:
    - { file: Makefile,      var: OS_TYPE_SETUP,                     new: '"RHEL8"', old: '"RHEL7"' }
    - { file: makefile.vars, var: RDFS_ALTERNATIVE_CLOCK_GENERATION, new: '1',       old: '0' }

  # Applied to Trunk IP dir only (TRUNK_IP_RXEWS_RUN_DIR_PATH):
  makefile_trunk_ip_changes:
    - { file: Makefile, var: GPUBASE,            new: '${EWS_LOCAL_REPO}/MASTER_RTL_IP/GPU/DXS-48-1536-MC', old: '${EWS_LOCAL_REPO}/MASTER_RTL/GPU/BXS-32-1024-MC' }
    - { file: Makefile, var: MASTER_LIST,        new: '${EWS_LOCAL_REPO}/MASTER_LIST_IP',  old: '${EWS_LOCAL_REPO}/MASTER_LIST' }
    - { file: Makefile, var: MASTER_RTL,         new: '${EWS_LOCAL_REPO}/MASTER_RTL_IP',   old: '${EWS_LOCAL_REPO}/MASTER_RTL' }
    - { file: Makefile, var: MASTER_BBOX,        new: '${EWS_LOCAL_REPO}/MASTER_BBOX_IP',  old: '${EWS_LOCAL_REPO}/MASTER_BBOX' }
    - { file: Makefile, var: MASTER_RTL_RTVRAM,  new: '/design01/shura_ipride_vf/99_users/TOP/SEC_IP/MASTER_RTL_FOR_RELEASE', old: '${EWS_LOCAL_REPO}/MASTER_RTL' }
    - { file: Makefile, var: MASTER_LIST_VRAM,   new: '${EWS_LOCAL_REPO}/MASTER_LIST_IP/u7808hrtvram0top0_unenc.list', old: '${EWS_LOCAL_REPO}/MASTER_LIST/u7808hrtvram0top0_unenc.list' }
    - { file: Makefile, var: MASTER_RTL_SEC,     new: '/design01/shura_ipride_vf/99_users/TOP/SEC_IP/MASTER_CONF_RTL_IP', old: '${EWS_LOCAL_REPO}/MASTER_RTL' }
    - { file: Makefile, var: MASTER_RTL_CR52,    new: '${EWS_LOCAL_REPO}/MASTER_RTL_IP',   old: '${EWS_LOCAL_REPO}/MASTER_RTL' }
    - { file: Makefile, var: MASTER_RTL_APU,     new: '${EWS_LOCAL_REPO}/MASTER_RTL_IP/apu', old: '${EWS_LOCAL_REPO}/MASTER_CONF_RTL/apcore_conf_rtl/apcore' }
    - { file: Makefile, old: 'RxEnv-${DATE_TAG}-${REV}/$(ip_name)', new: 'RxEnv-Trunk-IP-VNET-${REV}/$(ip_name)' }

  # Applied to Common IP dir only (COMMON_RXEWS_RUN_DIR_PATH):
  makefile_common_ip_changes:
    - { file: Makefile, var: GPUBASE,           new: '${EWS_LOCAL_REPO}/MASTER_RTL/GPU/DXS-48-1536-MC', old: '${EWS_LOCAL_REPO}/MASTER_RTL/GPU/BXS-32-1024-MC' }
    - { file: Makefile, var: MASTER_RTL_RTVRAM, new: '/design01/shura_ipride_vf/99_users/TOP/SEC_IP/MASTER_RTL_FOR_RELEASE', old: '${EWS_LOCAL_REPO}/MASTER_RTL' }
    - { file: Makefile, var: MASTER_RTL_SEC,    new: '/design01/shura_ipride_vf/99_users/TOP/SEC_IP/MASTER_CONF_RTL_IP', old: '${EWS_LOCAL_REPO}/MASTER_RTL' }
    - { file: Makefile, old: 'RxEnv-${DATE_TAG}-${REV}/$(ip_name)', new: 'RxEnv-Trunk-VNET-${REV}/$(ip_name)' }
