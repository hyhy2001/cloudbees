# auto_env - draft automation for bee (multi-account CloudBees)
# Edit this file, then: provision.csh (build cred+node) -> deploy.csh (create jobs) -> run.csh

# -- STABLE: rarely changes. cred+node reused via complete.yml --
base_name: RX_AUTO          # change by hand to avoid folder/node/job name clashes (RX_AUTO_v2...)
controller: ""              # "" = use the active controller; a name = auto `bee controller select`
rx_auto_root: /design01/.../RX_AUTO   # RX AUTO root on the agent (step 3 cd's into here). Set real path.

accounts:                   # Linux accounts -> 1 cred + 1 node each
  - { username: user01, password: pass01 }
  - { username: user02, password: pass02 }
  - { username: user03, password: pass03 }

node:
  host_common: 10.0.0.10    # ip_mode=common -> SSH this host
  host_trunk:  10.0.0.20    # ip_mode=trunk  -> SSH this host  (VLSI common/trunk)
  port: 22
  remote_dir_base: /home    # node remote-dir -> <base>/<username>
  executors: 2

# -- SWITCHES --
mode: manual                # manual (N jobs, work-stealing rx_run) | auto (1 job with schedule)
ip_mode: common             # common | trunk -> picks host + default IP_MODE param

# -- LSF submit (bs) - shared by manual step-3 and the rx_setup job --
# Everything runs inside one `tcsh -f -c '...'` so `source my_ride_setup` takes effect.
bs:
  host_groups: "HOSTGR_L HOSTGR_M HOSTGR_S HOSTGR_621910"
  os: REDHATE8
  mem: 12000
  ride_setup: my_ride_setup   # sourced inside tcsh, relative to RX_AUTO_ROOT

# -- manual = STEP 3 rx_run, WORK-STEALING --
# RX AUTO pre-splits the module list at setup into SUBMIT_LIST/NORMAL|COMMON/.._00,_01,...
# N accounts = N workers; each claims the next split file (atomic mkdir) until exhausted.
# accounts > splits -> extra workers idle; accounts < splits -> keep claiming.
#   trunk : 01_rx_run_ip_unit.bash        SUBMIT_LIST/NORMAL/normal_submit_module_list_XX
#   common: 02_rx_run_common_ip_unit.bash SUBMIT_LIST/COMMON/common_submit_module_list_XX
# REQUIRES: SUBMIT_LIST shared across nodes (shared claim dir). host=localhost satisfies this.
manual:
  job_prefix: build
  wait: false               # true = bee job run --wait (job runs multiple files sequentially)
  # $RX_AUTO_ROOT, $BS_GROUPS, $BS_OS, $BS_MEM, $RIDE_SETUP are injected by parse_config (from bs:).
  # $IP_MODE is a build param. Each claimed split file is submitted to LSF via bs, inside a single
  # tcsh that sources RiDE first (double-quotes for tcsh -c so they don't clash with bash).
  command: |
    cd "$RX_AUTO_ROOT/RX_AUTO"
    if [ "$IP_MODE" = trunk ]; then
      RX=01_rx_run_ip_unit.bash;        DIR=SUBMIT_LIST/NORMAL; PAT=normal_submit_module_list_
    else
      RX=02_rx_run_common_ip_unit.bash; DIR=SUBMIT_LIST/COMMON; PAT=common_submit_module_list_
    fi
    CLAIM="$DIR/.claimed"; mkdir -p "$CLAIM"
    for f in "$DIR"/${PAT}*; do
      [ -e "$f" ] || continue                       # no split files -> exit loop
      lock="$CLAIM/$(basename "$f")"
      mkdir "$lock" 2>/dev/null || continue          # claim failed (another worker holds it) -> skip
      echo "[worker] claim $f"
      bs -m "$BS_GROUPS" -I -os "$BS_OS" -M "$BS_MEM" \
        tcsh -f -c "source $RX_AUTO_ROOT/$RIDE_SETUP; bash $RX_AUTO_ROOT/RX_AUTO/$RX $f"
    done

# -- auto = STEP 3 go_rx_auto (orchestrator: detect -> queue -> run all). No index, IP_MODE only. --
auto:
  account: { username: user11, password: pass11 }   # 11th account, dedicated node for auto
  job_name: daily
  schedule: "H/30 * * * *"  # every 30 min: go_rx_auto detects SVN changes and runs
  command: |
    cd "$RX_AUTO_ROOT/RX_AUTO"
    if [ "$IP_MODE" = trunk ]; then ./01_go_rx_auto.bash; else ./02_go_rx_auto.bash; fi

# -- setup = STEP 1-2 as a bee job (alternative to running scripts/setup_all.bash by hand) --
# Runs on a DEDICATED account/node. One bs...tcsh sources RiDE + my_cmd + my_cmd_for_common,
# applies the Makefile common changes, then runs the step-2 makes. Env paths come from
# setup.vars below + bs: above; assembled by `parse_config plan-setup`.
setup:
  job_name: rx_setup
  account: { username: setupuser, password: setuppass }   # dedicated setup account (own cred+node)

  # -- S2 env vars (was rxews_makefile/setup.yaml). Empty "" = leave unchanged / unused. --
  # RX_AUTO_ROOT is the top-level rx_auto_root above (single source).
  vars:
    RIDE_ACTIVATE: ""                   # .../ride/templates/ride/activate.csh (S5, sourced)
    TRUNK_IP_RXEWS_RUN_DIR_PATH: ""     # my_cmd dir (rxews_trunk_ip_vnet_*) - Trunk IP, gets S4
    COMMON_RXEWS_RUN_DIR_PATH: ""       # my_cmd_for_common dir (rxews_trunk_vnet_*) - Common, gets S4
    DEDICATED_SV: ""                    # LSF host group (optional)
    RIDE_ENV_VER: ""                    # RiDE env version tag (optional)
    TRUNK_IP_ENV_BASE: ""               # rxews_trunk_ip_*/RxEnv-* (required for server_setup)
    COMMON_ENV_BASE: ""                 # rxews_trunk_*/RxEnv-*   (required for server_setup)
    DASHBOARD_DB_LOCATION: ""           # Dashboard DB path (required for server_setup)
    LOCAL_PYTHON: ""                    # Python 3.10+ binary (optional)
    LOCAL_PYTHON_BIN: ""                # Python bin dir (optional)
    COMMON_RUN_TYPE: Trunk              # fixed - do not change

  # -- S4 Makefile common changes, applied to BOTH env dirs. Empty new "" = skip that var. --
  makefile_common_changes:
    - { file: Makefile,      var: OS_TYPE_SETUP,                     new: '"RHEL8"', old: '"RHEL7"' }
    - { file: makefile.vars, var: RDFS_ALTERNATIVE_CLOCK_GENERATION, new: '1',       old: '0' }
