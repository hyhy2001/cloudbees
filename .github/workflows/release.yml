name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build binary
        run: bun run build.ts
        env:
          CB_SKIP_CODEGEN: "1"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bee
          generate_release_notes: true
